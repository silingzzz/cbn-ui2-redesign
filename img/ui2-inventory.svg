<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .panel{fill:#12161a;stroke:#2a3238;stroke-width:1}
      .body{fill:#e6e2d8;font-family:"Segoe UI",sans-serif;font-size:16px}
      .sec{fill:#9aa3a8;font-family:"Segoe UI",sans-serif;font-size:13px}
      .accent{fill:#7fb069}
      .amber{fill:#d9a03b}
      .danger{fill:#c2554a}
      .sel{fill:#3a4a3f}
      .btn{fill:#1c2429;stroke:#2a3238;stroke-width:1}
      .tab{fill:#9aa3a8;font-family:"Segoe UI",sans-serif;font-size:15px}
    </style>
  </defs>

  <!-- 背景地图（压暗） -->
  <rect width="1600" height="900" fill="#0c0f12"/>
  <g opacity="0.35">
    <rect x="0" y="0" width="1600" height="900" fill="#151a17"/>
    <g fill="#2b2f26">
      <rect x="60" y="640" width="240" height="120"/><rect x="1300" y="560" width="240" height="160"/>
    </g>
    <rect x="820" y="700" width="28" height="28" fill="#c9b37e"/>
  </g>

  <!-- 主面板 -->
  <rect class="panel" x="40" y="40" width="1520" height="820" rx="4"/>

  <!-- 标题栏 -->
  <rect x="40" y="40" width="1520" height="52" fill="#0f1316"/>
  <rect x="40" y="40" width="4" height="52" fill="#7fb069"/>
  <text class="body" x="60" y="74" style="font-size:19px;font-weight:600">INVENTORY</text>
  <text class="tab" x="200" y="74">Character</text>
  <text class="tab" x="320" y="74">Craft</text>
  <text class="tab" x="400" y="74">Build</text>
  <text class="sec" x="1480" y="74">×</text>

  <!-- 工具条 -->
  <rect x="40" y="92" width="1520" height="52" fill="#101418"/>
  <rect x="60" y="104" width="300" height="30" fill="#0b0e11" stroke="#2a3238"/>
  <text class="sec" x="72" y="124">Search…</text>
  <rect x="380" y="104" width="150" height="30" fill="#0b0e11" stroke="#2a3238"/>
  <text class="sec" x="392" y="124">Sort: Name ▾</text>
  <text class="sec" x="1200" y="124">Total 24.6 / 50 kg   38 / 60 L</text>

  <!-- 左：分类 -->
  <line x1="270" y1="144" x2="270" y2="820" stroke="#2a3238"/>
  <text class="sec" x="60" y="176">CATEGORY</text>
  <rect class="sel" x="52" y="192" width="206" height="34" rx="2"/>
  <rect x="52" y="192" width="3" height="34" fill="#7fb069"/>
  <text class="body" x="68" y="215">All</text><text class="sec" x="230" y="215">37</text>
  <text class="body" x="68" y="259">Tools</text><text class="sec" x="230" y="259">12</text>
  <text class="body" x="68" y="303">Food</text><text class="sec" x="230" y="303">5</text>
  <text class="body" x="68" y="347">Medication</text><text class="sec" x="230" y="347">8</text>
  <text class="body" x="68" y="391">Clothing</text><text class="sec" x="230" y="391">6</text>
  <text class="body" x="68" y="435">Ammo</text><text class="sec" x="230" y="435">4</text>
  <text class="body" x="68" y="479">Other</text><text class="sec" x="230" y="479">2</text>

  <!-- 中：列表 -->
  <text class="sec" x="292" y="176">NAME</text>
  <text class="sec" x="640" y="176">CAT</text>
  <text class="sec" x="760" y="176">QTY</text>
  <text class="sec" x="860" y="176">WEIGHT</text>
  <text class="sec" x="990" y="176">VOLUME</text>
  <line x1="292" y1="192" x2="1010" y2="192" stroke="#2a3238"/>

  <rect class="sel" x="284" y="202" width="734" height="34" rx="2"/>
  <rect x="284" y="202" width="3" height="34" fill="#7fb069"/>
  <text class="body" x="300" y="225">Crowbar</text>
  <text class="sec" x="640" y="225">Tools</text><text class="sec" x="760" y="225">1</text>
  <text class="sec" x="860" y="225">1.2 kg</text><text class="sec" x="990" y="225">2.5 L</text>

  <text class="body" x="300" y="269">Hammer</text>
  <text class="sec" x="640" y="269">Tools</text><text class="sec" x="760" y="269">1</text>
  <text class="sec" x="860" y="269">1.5 kg</text><text class="sec" x="990" y="269">1.0 L</text>

  <text class="body" x="300" y="313">Canned meat</text>
  <text class="sec" x="640" y="313">Food</text><text class="sec" x="760" y="313">3</text>
  <text class="sec" x="860" y="313">0.4 kg</text><text class="sec" x="990" y="313">0.5 L</text>

  <text class="body" x="300" y="357">Painkiller</text>
  <text class="sec" x="640" y="357">Medication</text><text class="sec" x="760" y="357">6</text>
  <text class="sec" x="860" y="357">0.1 kg</text><text class="sec" x="990" y="357">0.1 L</text>

  <text class="body" x="300" y="401">Rag</text>
  <text class="sec" x="640" y="401">Other</text><text class="sec" x="760" y="401">12</text>
  <text class="sec" x="860" y="401">0.1 kg</text><text class="sec" x="990" y="401">0.2 L</text>

  <text class="body" x="300" y="445">Flashlight</text>
  <text class="sec" x="640" y="445">Tools</text><text class="sec" x="760" y="445">1</text>
  <text class="sec" x="860" y="445">0.3 kg</text><text class="sec" x="990" y="445">0.4 L</text>

  <text class="body" x="300" y="489">Water bottle</text>
  <text class="sec" x="640" y="489">Food</text><text class="sec" x="760" y="489">2</text>
  <text class="sec" x="860" y="489">0.9 kg</text><text class="sec" x="990" y="489">1.0 L</text>

  <!-- 右：详情 -->
  <line x1="1030" y1="144" x2="1030" y2="820" stroke="#2a3238"/>
  <text class="body" x="1052" y="180" style="font-size:19px;font-weight:600">Crowbar</text>
  <text class="sec" x="1052" y="206">Tools · 1 item · 1.2 kg · 2.5 L</text>
  <line x1="1052" y1="222" x2="1536" y2="222" stroke="#2a3238"/>

  <text class="sec" x="1052" y="250">Bash damage</text>
  <text class="body" x="1330" y="250">12</text>
  <text class="sec" x="1052" y="280">Bash speed</text>
  <text class="body" x="1330" y="280">1.00</text>
  <text class="sec" x="1052" y="310">Material</text>
  <text class="body" x="1330" y="310">Steel</text>
  <text class="sec" x="1052" y="340">Condition</text>
  <text class="accent" x="1330" y="340">Pristine</text>

  <line x1="1052" y1="360" x2="1536" y2="360" stroke="#2a3238"/>
  <text class="sec" x="1052" y="390">Read-only preview — actions come in a later phase.</text>

  <!-- 按钮 -->
  <rect class="btn" x="1052" y="740" width="110" height="40" rx="4"/>
  <text class="accent" x="1082" y="766">Use</text>
  <rect class="btn" x="1174" y="740" width="110" height="40" rx="4"/>
  <text class="danger" x="1198" y="766">Drop</text>

  <!-- 状态行 -->
  <line x1="40" y1="820" x2="1560" y2="820" stroke="#2a3238"/>
  <text class="sec" x="60" y="846">37 items · 24.6 / 50 kg · 38 / 60 L · rebuilt this frame</text>
</svg>
